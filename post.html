<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Blog | Dra. Letícia Rocha, Osteopata</title>
<link rel="canonical" href="https://www.osteopataleticiarocha.com.br/blog">
<script>
// Links antigos do blog (post.html?id=...) levam para a página nova do artigo.
// Formato: 'id antigo': 'blog/titulo-do-artigo.html'. Sem correspondência, vai para o blog.
var POSTS_ANTIGOS = {};
var id = new URLSearchParams(location.search).get('id');
var destino = (id && POSTS_ANTIGOS[id]) || 'blog.html';
location.replace(destino);
</script>
<noscript><meta http-equiv="refresh" content="0; url=blog.html"></noscript>
</head>
